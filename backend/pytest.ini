[pytest]
testpaths = tests
# Puts the backend root on sys.path so `import app` works whether the suite is invoked as
# `pytest` or `python -m pytest`, on the host or inside the test image (WORKDIR /app).
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
